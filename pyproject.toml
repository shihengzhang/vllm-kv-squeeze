[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vllm-kv-squeeze"
version = "0.1.0"
description = "Pluggable KV-cache eviction policies for vLLM: drop tokens the model no longer needs to cut memory and latency."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "zsh", email = "zhangshiheng33@163.com" }]
keywords = ["llm", "inference", "vllm", "kv-cache", "eviction", "attention", "serving"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
vllm = ["vllm>=0.8.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/shihengzhang/vllm-kv-squeeze"
Repository = "https://github.com/shihengzhang/vllm-kv-squeeze"
Issues = "https://github.com/shihengzhang/vllm-kv-squeeze/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_kv_squeeze"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
